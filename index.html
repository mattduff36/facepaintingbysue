<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facepainting by Sue — Website Coming Soon</title>
    <meta name="description" content="Fun and colourful facepainting in Burton upon Trent. Our new website is coming soon!" />

    <!-- Social sharing -->
    <meta property="og:title" content="Facepainting by Sue — Coming Soon" />
    <meta property="og:description" content="Fun and colourful facepainting in Burton upon Trent. Our new website is coming soon!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="images/fpbs_logo-white-bg.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" as="image" href="images/fpbs_logo-white-bg.png" />

    <!-- Favicons -->
    <link rel="icon" href="images/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="images/favicon/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <main class="page">
      <!-- Decorative confetti -->
      <div aria-hidden="true" class="confetti" role="presentation"></div>

      <section class="card" aria-labelledby="heading">
        <img
          class="logo"
          src="images/fpbs_logo-white-bg.png"
          alt="Facepainting by Sue logo"
          width="480"
          height="480"
          decoding="async"
          loading="eager"
        />

        <h1 id="heading" class="brand">Bringing colourful smiles to Burton upon Trent</h1>
        <p class="coming">Website coming soon</p>

        <div class="chips" aria-hidden="true">
          <span class="chip chip-red">Birthdays</span>
          <span class="chip chip-blue">Fairs</span>
          <span class="chip chip-green">Events</span>
          <span class="chip chip-yellow">Parties</span>
        </div>
      </section>

      <footer class="footer">
        <small>Website developed by mpdee.co.uk © 2025. All rights reserved.</small>
      </footer>
    </main>

    
  </body>
  </html>
